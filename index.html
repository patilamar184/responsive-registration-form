<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Create your account by completing the registration form."
  >

  <title>Create an Account</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>
    <section class="registration" aria-labelledby="registration-title">

      <header class="registration__header">
        <h1 id="registration-title">Create your account</h1>
        <p>Join us today. It only takes a few minutes.</p>
      </header>

      <form action="#" method="post">

        <!-- Personal information -->
        <fieldset>
          <legend>Personal information</legend>

          <div class="form-group">
            <label for="full-name">Full name</label>
            <input
              type="text"
              id="full-name"
              name="full_name"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            >
          </div>

          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Choose a username"
              autocomplete="username"
              minlength="3"
              required
            >
          </div>

          <div class="form-group">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
          </div>

          <div class="form-group">
            <label for="phone">Phone number</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="+91 98765 43210"
              autocomplete="tel"
            >
          </div>
        </fieldset>


        <!-- Account security -->
        <fieldset>
          <legend>Account security</legend>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="8"
              required
            >
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm_password"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              minlength="8"
              required
            >
          </div>
        </fieldset>


        <!-- Gender -->
        <fieldset>
          <legend>Gender</legend>

          <label>
            <input
              type="radio"
              name="gender"
              value="male"
            >
            Male
          </label>

          <label>
            <input
              type="radio"
              name="gender"
              value="female"
            >
            Female
          </label>

          <label>
            <input
              type="radio"
              name="gender"
              value="prefer_not_to_say"
            >
            Prefer not to say
          </label>
        </fieldset>


        <!-- Terms -->
        <div class="form-group">
          <label>
            <input
              type="checkbox"
              name="terms"
              required
            >
            I agree to the terms and conditions.
          </label>
        </div>


        <button type="submit">
          Create account
        </button>

      </form>

    </section>
  </main>

</body>
</html>
